name: Staff account test

on:
  push:
    branches: [fb-staff-app-test]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  account-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FUNCTIONS_DISCOVERY_TIMEOUT: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - run: npm ci
      - run: npm ci --prefix functions
      - run: npm run build
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Test signup, activation and sign-in with Firebase Emulator
        run: >-
          npx firebase emulators:exec --project demo-laya-v4
          --only auth,firestore,storage,functions,hosting
          "npx playwright test tests/browser/accounts.spec.cjs --project=Chromium --reporter=list"
